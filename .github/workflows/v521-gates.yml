name: V5.2.1 Release Gates Pipeline

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]

jobs:
  gates-validation:
    name: Execute Release Gates Matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Bash and Verification Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Execute Verification Gates Pipeline
        run: |
          chmod +x verification/run-gates.sh
          ./verification/run-gates.sh

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: artifacts/verification/v5.2.1/
