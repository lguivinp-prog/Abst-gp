version: '3.8'

services:
  db:
    container_name: phase5_ring1_test_db
    restart: "no"
    ports:
      - "15432:5432"
    environment:
      APP_ENV: test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    container_name: phase5_ring1_test_redis
    restart: "no"
    volumes:
      - test_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    container_name: phase5_ring1_test_api
    restart: "no"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: phase5_ring1_test_worker
    restart: "no"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ocr:
    container_name: phase5_ring1_test_worker_ocr
    restart: "no"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
      - test_models:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: phase5_ring1_test_web
    restart: "no"
    depends_on:
      api:
        condition: service_started

volumes:
  test_pgdata:
  test_redisdata:
  test_uploads:
  test_models:


