name: abst_gp_test

services:
  db:
    image: postgres:16-alpine
    container_name: phase5_ring1_test_db
    restart: "no"
    ports:
      - "15433:5432"

    environment:
      APP_ENV: test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: v6_eval_test
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d v6_eval_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phase5_ring1_test_redis
    restart: "no"
    ports:
      - "16380:6379"
    volumes:
      - test_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    container_name: phase5_ring1_test_api
    build:
      context: .
      dockerfile: Dockerfile.backend.test
    command: ["/bin/sh", "-c", "sleep infinity"]
    restart: "no"
    ports:
      - "18000:8000"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/v6_eval_test
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: phase5_ring1_test_worker
    build:
      context: .
      dockerfile: Dockerfile.backend.test
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "default"]
    restart: "no"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/v6_eval_test
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ocr:
    container_name: phase5_ring1_test_worker_ocr
    build:
      context: .
      dockerfile: Dockerfile.backend.test
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "ocr_tasks"]
    restart: "no"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/v6_eval_test
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=test_secret_key
      - UPLOADS_DIR=/data/uploads
      - PYTHONDONTWRITEBYTECODE=1
      - OCR_ENGINE=v2
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app:ro
      - test_uploads:/data/uploads
      - test_models:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: phase5_ring1_test_web
    build:
      context: .
      dockerfile: Dockerfile.frontend.test
    restart: "no"
    ports:
      - "18080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  test_pgdata:
  test_redisdata:
  test_uploads:
  test_models:


