version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: abst_user
      POSTGRES_PASSWORD: abst_password
      POSTGRES_DB: abst_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abst_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://abst_user:abst_password@postgres:5432/abst_db
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=LOCAL
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: rq worker high default low -u redis://redis:6379/0
    environment:
      - DATABASE_URL=postgresql://abst_user:abst_password@postgres:5432/abst_db
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=LOCAL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  worker-ocr:
    build: 
      context: ./backend
      dockerfile: Dockerfile.ocr # Specialized OCR container with tesseract/poppler
    command: rq worker ocr -u redis://redis:6379/0
    environment:
      - DATABASE_URL=postgresql://abst_user:abst_password@postgres:5432/abst_db
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_MODE=LOCAL
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
