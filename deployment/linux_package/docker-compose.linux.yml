# ABST-GP V6 — Perfil de Despliegue para Servidor Linux Dedicado (P19)
# Configuración aislada de producción institucional
# Expone UNICAMENTE el puerto HTTPS 443 mediante Reverse Proxy TLS (Caddy)
# PostgreSQL, Redis y workers NO exponen puertos al exterior

name: abst_production

services:
  db:
    image: postgres:15-alpine
    container_name: abst_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abst_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Requerido password seguro para base de datos}
      POSTGRES_DB: ${POSTGRES_DB:-abst_gp_lan}
    volumes:
      - abst_prod_pgdata:/var/lib/postgresql/data
    networks:
      - abst_prod_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abst_admin} -d ${POSTGRES_DB:-abst_gp_lan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: abst_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Requerido password seguro para Redis}", "--appendonly", "yes"]
    volumes:
      - abst_prod_redisdata:/data
    networks:
      - abst_prod_backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abst_prod_api
    restart: unless-stopped
    environment:
      - APP_ENV=lan
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-abst_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abst_gp_lan}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Requerido SECRET_KEY seguro de produccion}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?Requerido clave de 32 bytes para cifrado MFA}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?Requerido clave de 32 bytes para cifrado de respaldo}
      - BACKUP_SIGNING_KEY=${BACKUP_SIGNING_KEY:?Requerido clave de 32 bytes para firma de respaldo}
      - UPLOADS_DIR=/data/uploads
      - TRUSTED_PROXIES=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8
      - VALIDATION_API_KEY=${VALIDATION_API_KEY:?Requerido VALIDATION_API_KEY para entorno LAN}
      - ALERT_CHANNEL=${ALERT_CHANNEL:-webhook}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_TELEGRAM_BOT_TOKEN=${ALERT_TELEGRAM_BOT_TOKEN:-}
      - ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - abst_prod_uploads:/data/uploads
      - ./verification:/app/verification:ro
      - abst_prod_backups:/data/backups
    networks:
      - abst_prod_backend
      - abst_prod_frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abst_prod_worker
    restart: unless-stopped
    command: ["rq", "worker", "-u", "redis://:${REDIS_PASSWORD}@redis:6379/0", "default"]
    environment:
      - APP_ENV=lan
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-abst_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abst_gp_lan}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - UPLOADS_DIR=/data/uploads
      - ALERT_CHANNEL=${ALERT_CHANNEL:-webhook}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - abst_prod_uploads:/data/uploads
      - ./verification:/app/verification:ro
    networks:
      - abst_prod_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    container_name: abst_prod_worker_ocr
    restart: unless-stopped
    command: ["rq", "worker", "-u", "redis://:${REDIS_PASSWORD}@redis:6379/0", "ocr_tasks"]
    environment:
      - APP_ENV=lan
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-abst_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abst_gp_lan}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - UPLOADS_DIR=/data/uploads
    volumes:
      - abst_prod_uploads:/data/uploads
      - ./verification:/app/verification:ro
    networks:
      - abst_prod_backend
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          memory: 1024M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abst_prod_web
    restart: unless-stopped
    networks:
      - abst_prod_frontend
    depends_on:
      - api

  proxy:
    image: caddy:2.8-alpine
    container_name: abst_prod_proxy
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP:?Requerido IP de interfaz fija LAN_BIND_IP}:443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    volumes:
      - ./deployment/linux_package/Caddyfile.linux:/etc/caddy/Caddyfile:ro
      - ./deployment/caddy/certs:/certs:ro
      - abst_prod_caddy_data:/data
      - abst_prod_caddy_config:/config
    networks:
      - abst_prod_frontend
    depends_on:
      - web
      - api

networks:
  abst_prod_backend:
    internal: true
  abst_prod_frontend:
    internal: false

volumes:
  abst_prod_pgdata:
  abst_prod_redisdata:
  abst_prod_uploads:
  abst_prod_backups:
  abst_prod_caddy_data:
  abst_prod_caddy_config:
