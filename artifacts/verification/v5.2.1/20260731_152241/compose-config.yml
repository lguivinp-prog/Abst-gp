name: abst_gp_v52_validation
services:
  backend-test:
    build:
      context: C:\Users\PC\Documents\AbastLG\abst-v4_9-remediation-clean
      dockerfile: Dockerfile.backend.test
    command:
      - /bin/sh
      - -c
      - sleep infinity
    depends_on:
      db-test:
        condition: service_healthy
        required: true
      redis-test:
        condition: service_healthy
        required: true
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@db-test:5432/test_db
      ENVIRONMENT: test
      PYTHONPATH: /app
      REDIS_URL: redis://redis-test:6379/1
      SECRET_KEY: synthetic_secret_key_for_testing
      TEST_REDIS_URL: redis://redis-test:6379/1
      UPLOADS_DIR: /app/uploads
    networks:
      default: null
    volumes:
      - type: bind
        source: C:\Users\PC\Documents\AbastLG\abst-v4_9-remediation-clean\backend
        target: /app
        bind: {}
      - type: volume
        source: test-uploads
        target: /app/uploads
        volume: {}
  db-test:
    environment:
      POSTGRES_DB: test_db
      POSTGRES_PASSWORD: test_password
      POSTGRES_USER: test_user
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U test_user -d test_db
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 5s
    image: postgres:15
    networks:
      default: null
    volumes:
      - type: volume
        source: test-db-data
        target: /var/lib/postgresql/data
        volume: {}
  frontend-test:
    build:
      context: C:\Users\PC\Documents\AbastLG\abst-v4_9-remediation-clean
      dockerfile: Dockerfile.frontend.test
    command:
      - /bin/sh
      - -c
      - sleep infinity
    networks:
      default: null
    volumes:
      - type: bind
        source: C:\Users\PC\Documents\AbastLG\abst-v4_9-remediation-clean\frontend
        target: /app
        bind: {}
  redis-test:
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
      interval: 5s
      retries: 5
    image: redis:7-alpine
    networks:
      default: null
networks:
  default:
    name: abst_gp_v52_validation_default
volumes:
  test-db-data:
    name: abst_gp_v52_validation_test-db-data
  test-uploads:
    name: abst_gp_v52_validation_test-uploads
