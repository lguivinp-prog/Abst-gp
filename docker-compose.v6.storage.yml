version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: abst_v6_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbucket:
    image: minio/mc
    container_name: abst_v6_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/abst-documents;
      /usr/bin/mc anonymous set private myminio/abst-documents;
      exit 0;
      "

volumes:
  minio_data:
